name: offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore JevReview.slnx
      - run: dotnet build JevReview.slnx -c Release --no-restore
      - run: dotnet test JevReview.slnx -c Release --no-build --no-restore
      - run: dotnet run --project src/JevReview.Cli -c Release --no-build -- classify --dataset datasets/smoke --mode fake --output runs/ci-smoke
